<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js 动画技术演示台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0e14;
    --panel: #10151d;
    --line: #223142;
    --gold: #d4a83c;
    --cyan: #4fd1c5;
    --text: #e8ecf1;
    --muted: #6b7785;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  #canvas-host{ position:fixed; inset:0; }
  canvas{ display:block; }

  .mono{ font-family:'Space Mono', monospace; }

  /* faint blueprint grid backdrop behind the canvas */
  #canvas-host::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(79,209,197,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,209,197,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events:none;
    z-index:0;
  }

  .hud{ position:fixed; z-index:5; pointer-events:none; }
  .hud * { pointer-events:auto; }

  .title-block{
    top:24px; left:24px;
    max-width: 360px;
  }
  .title-block h1{
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 4px 0;
    color: var(--gold);
  }
  .title-block p{
    margin:0; font-size:12px; line-height:1.6; color: var(--muted);
  }

  .bracket{
    position:relative;
    border: 1px solid var(--line);
    background: rgba(16,21,29,0.72);
    backdrop-filter: blur(4px);
    padding: 10px 14px;
  }
  .bracket::before, .bracket::after{
    content:""; position:absolute; width:10px; height:10px;
    border-color: var(--cyan); border-style: solid;
  }
  .bracket::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .bracket::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .legend{
    bottom: 24px; left: 24px;
    display:flex; flex-direction:column; gap:8px;
  }
  .legend .item{
    font-size: 11px;
    display:flex; gap:10px; align-items:center;
    padding: 6px 12px;
  }
  .legend .idx{ color: var(--gold); }
  .legend .swatch{ width:8px; height:8px; border-radius:50%; }

  .telemetry{
    top: 24px; right: 24px;
    text-align:right;
    min-width: 150px;
  }
  .telemetry .row{
    font-size: 11px; display:flex; justify-content:space-between; gap:16px;
    margin: 2px 0;
  }
  .telemetry .row span:first-child{ color: var(--muted); }
  .telemetry .row span:last-child{ color: var(--cyan); }

  .controls{
    bottom: 24px; right: 24px;
    display:flex; gap:8px;
  }
  button{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(16,21,29,0.72);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  button:hover{ border-color: var(--cyan); color: var(--cyan); }
  button.active{ border-color: var(--gold); color: var(--gold); }

  @media (max-width: 640px){
    .legend, .telemetry{ display:none; }
    .title-block p{ display:none; }
  }
</style>
</head>
<body>

<div id="canvas-host"></div>

<div class="hud title-block bracket">
  <h1>Three.js // Animation Lab</h1>
  <p>拖拽旋转视角 · 滚轮缩放 · 5 种独立动画技术并行运行</p>
</div>

<div class="hud legend bracket">
  <div class="item"><span class="idx">01</span><span class="swatch" style="background:var(--gold)"></span> 层级轨道旋转（父子 Group 继承变换）</div>
  <div class="item"><span class="idx">02</span><span class="swatch" style="background:#4fd1c5"></span> 顶点位移波浪（逐帧改写 BufferGeometry）</div>
  <div class="item"><span class="idx">03</span><span class="swatch" style="background:#e07856"></span> 缓动弹跳 + HSL 色相循环</div>
  <div class="item"><span class="idx">04</span><span class="swatch" style="background:#8fa3b8"></span> 粒子星场（Points + 整体旋转）</div>
  <div class="item"><span class="idx">05</span><span class="swatch" style="background:#c9c9c9"></span> 相机自动环绕（OrbitControls autoRotate）</div>
</div>

<div class="hud telemetry bracket mono">
  <div class="row"><span>ELAPSED</span><span id="t-elapsed">0.0s</span></div>
  <div class="row"><span>FRAME</span><span id="t-frame">0</span></div>
  <div class="row"><span>ORBIT ANGLE</span><span id="t-angle">0°</span></div>
  <div class="row"><span>STATE</span><span id="t-state">RUNNING</span></div>
</div>

<div class="hud controls">
  <button id="btn-pause">暂停</button>
  <button id="btn-wire">线框</button>
  <button id="btn-rotate" class="active">自转相机</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- basic scene setup ----------
const host = document.getElementById('canvas-host');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.018);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(18, 14, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 60;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- lighting ----------
scene.add(new THREE.AmbientLight(0x2a3646, 1.2));
const sunLight = new THREE.PointLight(0xd4a83c, 3, 60, 2);
sunLight.position.set(0, 2, 0);
scene.add(sunLight);
const rim = new THREE.DirectionalLight(0x4fd1c5, 0.5);
rim.position.set(-10, 10, -10);
scene.add(rim);

// ============================================================
// 01 — Orbital hierarchy: Group parenting inherits transforms
// ============================================================
const solarRoot = new THREE.Group();
solarRoot.position.set(-8, 3, -4);
scene.add(solarRoot);

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(1.4, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xd4a83c })
);
solarRoot.add(sun);

// soft glow sprite behind the sun
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, 'rgba(212,168,60,0.55)');
  g.addColorStop(1, 'rgba(212,168,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent:true, depthWrite:false }));
glow.scale.set(6,6,1);
solarRoot.add(glow);

function makeOrbitRing(radius, color){
  const pts = [];
  for (let i=0;i<=64;i++){
    const a = (i/64) * Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.35 });
  return new THREE.LineLoop(geo, mat);
}

const planetMats = [];

// planet 1 + moon
const pivot1 = new THREE.Group();
solarRoot.add(pivot1);
solarRoot.add(makeOrbitRing(4, 0x4fd1c5));
const planet1 = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 24, 24),
  new THREE.MeshStandardMaterial({ color: 0x4fd1c5, roughness:0.5 })
);
planet1.position.x = 4;
pivot1.add(planet1);
planetMats.push(planet1.material);

const moonPivot = new THREE.Group();
planet1.add(moonPivot);
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xc9c9c9, roughness:0.7 })
);
moon.position.x = 1.1;
moonPivot.add(moon);
planetMats.push(moon.material);

// planet 2 (tilted orbit)
const pivot2 = new THREE.Group();
pivot2.rotation.x = 0.35;
solarRoot.add(pivot2);
const ring2 = makeOrbitRing(6.6, 0xe07856);
ring2.rotation.x = 0.35;
solarRoot.add(ring2);
const planet2 = new THREE.Mesh(
  new THREE.SphereGeometry(0.85, 24, 24),
  new THREE.MeshStandardMaterial({ color: 0xe07856, roughness:0.5 })
);
planet2.position.x = 6.6;
pivot2.add(planet2);
planetMats.push(planet2.material);

// ============================================================
// 02 — Vertex-displaced wave grid (rewriting BufferGeometry each frame)
// ============================================================
const waveGeo = new THREE.PlaneGeometry(16, 16, 48, 48);
waveGeo.rotateX(-Math.PI/2);
const waveMat = new THREE.MeshBasicMaterial({ color: 0x4fd1c5, wireframe: true, transparent:true, opacity:0.55 });
const waveMesh = new THREE.Mesh(waveGeo, waveMat);
waveMesh.position.set(8, -1.5, 4);
scene.add(waveMesh);
const wavePos = waveGeo.attributes.position;
const waveBase = wavePos.array.slice(); // original x,y,z for reference

// ============================================================
// 03 — Easing bounce + HSL color-cycling cubes
// ============================================================
const bounceGroup = new THREE.Group();
bounceGroup.position.set(2, -1.5, 12);
scene.add(bounceGroup);
const cubes = [];
const CUBE_COUNT = 6;
for (let i=0;i<CUBE_COUNT;i++){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:0.35 })
  );
  mesh.position.x = (i - (CUBE_COUNT-1)/2) * 1.6;
  bounceGroup.add(mesh);
  cubes.push({ mesh, phase: i * 0.5 });
}

// ============================================================
// 04 — Particle star field
// ============================================================
const STAR_COUNT = 2200;
const starPositions = new Float32Array(STAR_COUNT * 3);
for (let i=0;i<STAR_COUNT;i++){
  const r = 40 + Math.random()*60;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(Math.random()*2 - 1);
  starPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i*3+1] = r * Math.cos(phi);
  starPositions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0x8fa3b8, size: 0.14, transparent:true, opacity:0.85 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ============================================================
// UI wiring
// ============================================================
let paused = false;
let wireframeOn = false;

document.getElementById('btn-pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? '继续' : '暂停';
  e.target.classList.toggle('active', paused);
  document.getElementById('t-state').textContent = paused ? 'PAUSED' : 'RUNNING';
});

document.getElementById('btn-wire').addEventListener('click', (e) => {
  wireframeOn = !wireframeOn;
  planetMats.forEach(m => m.wireframe = wireframeOn);
  cubes.forEach(c => c.mesh.material.wireframe = wireframeOn);
  e.target.classList.toggle('active', wireframeOn);
});

document.getElementById('btn-rotate').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.target.classList.toggle('active', controls.autoRotate);
});

// ---------- animation loop ----------
const clock = new THREE.Clock();
let frame = 0;
const elElapsed = document.getElementById('t-elapsed');
const elFrame = document.getElementById('t-frame');
const elAngle = document.getElementById('t-angle');

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (!paused){
    frame++;

    // 01 orbital motion
    sun.rotation.y += dt * 0.3;
    pivot1.rotation.y += dt * 0.9;
    planet1.rotation.y += dt * 1.6;
    moonPivot.rotation.y += dt * 3.2;
    pivot2.rotation.y += dt * 0.5;
    planet2.rotation.y += dt * 1.1;

    // 02 wave displacement
    for (let i=0;i<wavePos.count;i++){
      const bx = waveBase[i*3];
      const bz = waveBase[i*3+2];
      const y = Math.sin(bx*0.4 + t*1.4) * 0.35 + Math.cos(bz*0.4 + t*1.1) * 0.35;
      wavePos.setY(i, y);
    }
    wavePos.needsUpdate = true;

    // 03 bounce + color cycle
    cubes.forEach((c, i) => {
      const b = Math.abs(Math.sin(t*2 + c.phase));
      c.mesh.position.y = b * 2;
      const s = 0.7 + b*0.5;
      c.mesh.scale.set(s,s,s);
      const hue = (t*0.08 + i*0.12) % 1;
      c.mesh.material.color.setHSL(hue, 0.65, 0.55);
    });

    // 04 star field slow rotation
    stars.rotation.y += dt * 0.01;
    stars.rotation.x += dt * 0.003;

    // telemetry
    elElapsed.textContent = t.toFixed(1) + 's';
    elFrame.textContent = frame;
    elAngle.textContent = ((pivot1.rotation.y * 180/Math.PI) % 360).toFixed(0) + '°';
  }

  controls.update(); // 05 camera auto-orbit + damping
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
