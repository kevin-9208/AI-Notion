<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>霓虹战场</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07020f;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;cursor:none}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 0 10px #0ff}
#sc{font-size:32px;font-weight:800;letter-spacing:2px}
.sm{font-size:13px;opacity:.75}
#cb{font-size:18px;font-weight:800;color:#ffd23f;text-shadow:0 0 10px #fa0;min-height:24px}
#wv{font-size:20px;font-weight:700;color:#ff7ad9;text-shadow:0 0 10px #f0c;text-align:center}
.bars{width:min(210px,34vw);text-align:right}
.bar{height:12px;border:2px solid #2ef;border-radius:8px;overflow:hidden;box-shadow:0 0 10px #2ef}
.bar i{display:block;height:100%;width:100%;background:#2ef;transition:width .12s}
#buf{font-size:12px;margin-top:6px;color:#7dffb0;min-height:16px}
#toast{position:fixed;top:26%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 0 16px #0ff;opacity:0;transition:opacity .3s;pointer-events:none}
#db{display:none;position:fixed;right:22px;bottom:24px;width:78px;height:78px;border-radius:50%;font:700 17px inherit;font-family:inherit;color:#fff;border:3px solid #2ef;background:rgba(0,255,255,.16);box-shadow:0 0 16px #2ef}
@media (pointer:coarse){#db{display:block}canvas{cursor:default}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(7,2,15,.74);backdrop-filter:blur(4px);padding:20px}
h1{font-size:clamp(34px,8vw,62px);margin:0 0 14px;background:linear-gradient(90deg,#00f0ff,#ff3dd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #a3f)}
#msg{line-height:1.9;opacity:.9;margin:0 0 26px;font-size:16px}
button#go{font:700 20px inherit;font-family:inherit;color:#fff;padding:12px 44px;border:2px solid #0ff;border-radius:30px;background:rgba(0,255,255,.12);cursor:pointer;box-shadow:0 0 18px #0ff;transition:.15s}
button#go:hover{background:rgba(0,255,255,.3);transform:scale(1.06)}
#pause{display:none;font-size:34px;font-weight:800;letter-spacing:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div><div id="sc">0</div><div id="best" class="sm"></div><div id="cb"></div></div>
 <div id="wv">第 1 波</div>
 <div class="bars"><div class="sm">生命</div><div class="bar"><i id="hp"></i></div><div id="buf"></div></div>
</div>
<div id="toast"></div>
<button id="db">冲刺</button>
<div id="menu" class="ov"><h1>霓虹战场</h1>
<p id="msg">WASD / 方向键 移动 · 鼠标瞄准 · 按住左键射击<br>空格 / Shift / 右键 冲刺(无敌且能撞伤小怪)<br>手机:左半屏移动摇杆,右半屏瞄准并自动开火<br>击杀连击提升倍率 · 拾取道具:<b style="color:#4f8">S</b>散弹 <b style="color:#fa3">R</b>速射 <b style="color:#f48">+</b>回血 <b style="color:#4af">O</b>护盾<br>P 暂停 · M 静音</p>
<button id="go">开始战斗</button></div>
<div id="pause" class="ov">已暂停<div class="sm" style="letter-spacing:0;margin-top:10px;font-weight:400">点击屏幕或按 P 继续</div></div>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('c'),ctx=cv.getContext('2d');let W,H,dpr;
const p={x:0,y:0,r:14,hp:100,ang:0,cd:0,invuln:0,dash:0,dashCd:0,dx:0,dy:0,shield:0,spread:0,rapid:0,vis:true};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);p.x=clamp(p.x||W/2,20,W-20);p.y=clamp(p.y||H/2,20,H-20);}
addEventListener('resize',resize);resize();

const ET={g:{r:12,hp:1,sp:95,c:'#ff3355',pts:10},r:{r:9,hp:1,sp:200,c:'#ffd23f',pts:20},t:{r:24,hp:9,sp:55,c:'#b06bff',pts:60},u:{r:13,hp:3,sp:70,c:'#22eeff',pts:40}};
const PU={S:{c:'#44ff88'},R:{c:'#ffaa33'},H:{c:'#ff4488',l:'+'},D:{c:'#44aaff',l:'O'}};
const enemies=[],pb=[],eb=[],parts=[],pus=[],keys={};
let state='menu',paused=false,score=0,wave=0,toSpawn=0,spawnT=0,waveWait=0,combo=0,comboT=0,shake=0,tt=0,muted=false,dashReq=false,dashId=0;
let mx=0,my=0,mDown=false,best=0;try{best=+localStorage.getItem('arena_best')||0}catch(e){}
const sticks={l:null,r:null};

// 音效
let ac,lastShot=0;
function snd(f,d,type='square',v=.03,slide=0){
 if(muted)return;
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d);}catch(e){}
}
let tmr;function toast(s,c='#fff'){const t=$('toast');t.textContent=s;t.style.color=c;t.style.opacity=1;clearTimeout(tmr);tmr=setTimeout(()=>t.style.opacity=0,1100);}
const mult=()=>Math.min(5,1+Math.floor(combo/5));
function hud(){
 $('sc').textContent=score;$('best').textContent='最高 '+best;$('wv').textContent='第 '+wave+' 波';
 $('cb').textContent=combo>=3?'连击 '+combo+'  ×'+mult():'';
 const h=$('hp');h.style.width=Math.max(0,p.hp)+'%';h.style.background=p.hp>50?'#2ef':p.hp>25?'#fb3':'#f35';
 const b=[];if(p.spread>0)b.push('散弹 '+Math.ceil(p.spread)+'s');if(p.rapid>0)b.push('速射 '+Math.ceil(p.rapid)+'s');if(p.shield>0)b.push('护盾');
 $('buf').textContent=b.join(' · ');
}

// 特效
function boom(x,y,c,n=14,sc=1){
 for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(40,260)*sc,l=rnd(.3,.7);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,L:l,c:i%4?c:'#fff',s:rnd(2,4.5)});}
}

// 游戏流程
function startWave(){
 wave++;toSpawn=5+wave*3+Math.floor(wave*wave*.4);spawnT=.6;waveWait=0;toast('第 '+wave+' 波','#7dffff');hud();
}
function spawnEnemy(){
 const r=Math.random();let t='g';
 if(wave>=4&&r<.1)t='t';else if(wave>=3&&r<.28)t='u';else if(wave>=2&&r<.5)t='r';
 const c=ET[t],s=Math.floor(Math.random()*4),m=40;let x,y;
 if(s===0){x=rnd(0,W);y=-m}else if(s===1){x=W+m;y=rnd(0,H)}else if(s===2){x=rnd(0,W);y=H+m}else{x=-m;y=rnd(0,H)}
 enemies.push({t,x,y,r:c.r,hp:c.hp,mhp:c.hp,sp:c.sp*(1+Math.min(.5,wave*.03)),c:c.c,pts:c.pts,fl:0,ft:rnd(.8,1.8),ph:rnd(0,6),dh:-1,kx:0,ky:0});
}
function drop(x,y,big){
 if(Math.random()>(big?.35:.1))return;
 const k=Object.keys(PU),t=Math.random()<.3?'H':k[Math.floor(Math.random()*k.length)];
 pus.push({x,y,t,l:10});
}
function kill(i){
 const e=enemies[i];combo++;comboT=2.2;score+=e.pts*mult();
 boom(e.x,e.y,e.c,e.t==='t'?36:16,e.t==='t'?1.4:1);shake=Math.max(shake,e.t==='t'?.8:.25);snd(e.t==='t'?90:200,.18,'sawtooth',.05,-80);
 drop(e.x,e.y,e.t==='t');enemies.splice(i,1);
}
function hurt(n){
 if(p.invuln>0||p.dash>0)return;
 if(p.shield>0){p.shield=0;p.invuln=.6;boom(p.x,p.y,'#44aaff',20);snd(600,.2,'sine',.05,-300);return;}
 p.hp-=n;p.invuln=.9;shake=1;combo=0;boom(p.x,p.y,'#ff4466',14);snd(120,.25,'sawtooth',.07,-60);
 if(p.hp<=0)die();
}
function die(){
 state='over';p.vis=false;boom(p.x,p.y,'#22eeff',70,1.6);snd(70,.8,'sawtooth',.1,-35);
 if(score>best){best=score;try{localStorage.setItem('arena_best',best)}catch(e){}}
 setTimeout(()=>{if(state==='over'){$('msg').innerHTML='你倒下了<br>得分 <b>'+score+'</b> · 最高 '+best+' · 坚持到第 '+wave+' 波';$('go').textContent='再战一次';$('menu').style.display='flex';}},900);
}
function start(){
 enemies.length=pb.length=eb.length=parts.length=pus.length=0;
 Object.assign(p,{x:W/2,y:H/2,hp:100,cd:0,invuln:1.2,dash:0,dashCd:0,shield:0,spread:0,rapid:0,vis:true});
 score=0;wave=0;combo=0;comboT=0;shake=0;state='play';paused=false;
 $('menu').style.display='none';$('pause').style.display='none';startWave();snd(500,.2,'sine',.05,500);
}
function setPause(v){if(state!=='play')return;paused=v;$('pause').style.display=v?'flex':'none';}

function shoot(){
 const a=p.ang,sp=p.spread>0,n=sp?5:1,bx=p.x+Math.cos(a)*22,by=p.y+Math.sin(a)*22;
 for(let i=0;i<n;i++){const aa=a+(sp?(i-2)*.14:0)+rnd(-.02,.02);pb.push({x:bx,y:by,vx:Math.cos(aa)*720,vy:Math.sin(aa)*720,l:1.1});}
 p.cd=(sp?.2:.12)*(p.rapid>0?.5:1);
 const now=performance.now();if(now-lastShot>70){lastShot=now;snd(sp?260:800,.06,'square',.012,-300);}
}

function update(dt){
 tt+=dt;
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.05,dt);q.vy*=Math.pow(.05,dt);}
 shake=Math.max(0,shake-dt*2.5);
 if(state==='over'){for(const e of enemies){e.x+=rnd(-1,1)*20*dt;}}
 if(state!=='play'){dashReq=false;return;}
 // 玩家
 let ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(sticks.l){ax=(sticks.l.x-sticks.l.ox)/55;ay=(sticks.l.y-sticks.l.oy)/55;}
 let ml=Math.hypot(ax,ay);if(ml>1){ax/=ml;ay/=ml;ml=1;}if(ml<.12){ax=ay=0;ml=0;}
 let firing=mDown;
 if(sticks.r){const dx=sticks.r.x-sticks.r.ox,dy=sticks.r.y-sticks.r.oy;if(Math.hypot(dx,dy)>12){p.ang=Math.atan2(dy,dx);firing=true;}}
 else if(!('ontouchstart' in window&&!mx))p.ang=Math.atan2(my-p.y,mx-p.x);
 p.dashCd=Math.max(0,p.dashCd-dt);p.invuln=Math.max(0,p.invuln-dt);
 if(dashReq&&p.dashCd<=0&&p.dash<=0){
  p.dash=.18;p.dashCd=1.6;dashId++;p.invuln=Math.max(p.invuln,.3);
  const l=ml>0?ml:1;p.dx=ml>0?ax/l:Math.cos(p.ang);p.dy=ml>0?ay/l:Math.sin(p.ang);snd(300,.18,'sine',.05,500);
 }
 dashReq=false;
 if(p.dash>0){p.dash-=dt;p.x+=p.dx*860*dt;p.y+=p.dy*860*dt;parts.push({x:p.x,y:p.y,vx:0,vy:0,l:.25,L:.25,c:'#22eeff',s:9});}
 else{p.x+=ax*270*dt;p.y+=ay*270*dt;}
 p.x=clamp(p.x,p.r,W-p.r);p.y=clamp(p.y,p.r,H-p.r);
 p.cd-=dt;if(firing&&p.cd<=0)shoot();
 p.spread=Math.max(0,p.spread-dt);p.rapid=Math.max(0,p.rapid-dt);if(p.shield>0)p.shield-=dt;
 comboT-=dt;if(comboT<=0)combo=0;
 // 波次
 if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawnEnemy();toSpawn--;spawnT=Math.max(.2,.85-wave*.035);}}
 else if(enemies.length===0){
  if(waveWait===0){waveWait=2.2;score+=wave*100;p.hp=Math.min(100,p.hp+15);toast('第 '+wave+' 波清除  +'+wave*100,'#7dffb0');}
  waveWait-=dt;if(waveWait<=0)startWave();
 }
 // 玩家子弹
 for(let i=pb.length-1;i>=0;i--){
  const b=pb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  if(b.l<=0||b.x<-20||b.y<-20||b.x>W+20||b.y>H+20){pb.splice(i,1);continue;}
  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j],dx=e.x-b.x,dy=e.y-b.y;
   if(dx*dx+dy*dy<(e.r+4)**2){pb.splice(i,1);e.hp--;e.fl=.08;e.kx+=b.vx*.01;e.ky+=b.vy*.01;boom(b.x,b.y,e.c,3,.5);snd(350,.04,'square',.015,-100);if(e.hp<=0)kill(j);break;}
  }
 }
 // 敌人
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.fl=Math.max(0,e.fl-dt);
  let dx=p.x-e.x,dy=p.y-e.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  let vx=dx,vy=dy,spd=e.sp;
  if(e.t==='r'){const w=Math.sin(tt*5+e.ph)*.6;vx=dx-dy*w;vy=dy+dx*w;}
  if(e.t==='u'){
   if(d<200){vx=-dx;vy=-dy;}else if(d<280){vx=-dy;vy=dx;spd*=.7;}
   if((e.ft-=dt)<=0&&e.x>0&&e.x<W&&e.y>0&&e.y<H){e.ft=rnd(1.4,2.4);const a=Math.atan2(p.y-e.y,p.x-e.x)+rnd(-.12,.12);eb.push({x:e.x,y:e.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,l:4});}
  }
  e.x+=(vx*spd+e.kx*60)*dt;e.y+=(vy*spd+e.ky*60)*dt;e.kx*=Math.pow(.02,dt);e.ky*=Math.pow(.02,dt);
  for(let j=i-1;j>=0;j--){const o=enemies[j],ox=e.x-o.x,oy=e.y-o.y,dd=Math.hypot(ox,oy)||1,m=e.r+o.r;
   if(dd<m){const k=(m-dd)*.5/dd;e.x+=ox*k;e.y+=oy*k;o.x-=ox*k;o.y-=oy*k;}}
  if(d<e.r+p.r){
   if(p.dash>0){if(e.dh!==dashId){e.dh=dashId;e.hp-=3;e.fl=.1;e.kx+=-dx*14;e.ky+=-dy*14;boom(e.x,e.y,e.c,8);if(e.hp<=0){kill(i);continue;}}}
   else if(p.invuln<=0){hurt(15);e.kx+=-dx*10;e.ky+=-dy*10;}
  }
 }
 // 敌方子弹
 for(let i=eb.length-1;i>=0;i--){
  const b=eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  if(b.l<=0||b.x<-20||b.y<-20||b.x>W+20||b.y>H+20){eb.splice(i,1);continue;}
  const dx=b.x-p.x,dy=b.y-p.y;
  if(dx*dx+dy*dy<(p.r+4)**2){eb.splice(i,1);hurt(10);}
 }
 // 道具
 for(let i=pus.length-1;i>=0;i--){
  const u=pus[i];u.l-=dt;if(u.l<=0){pus.splice(i,1);continue;}
  if(Math.hypot(u.x-p.x,u.y-p.y)<p.r+14){
   if(u.t==='S'){p.spread=12;toast('散弹!','#44ff88');}else if(u.t==='R'){p.rapid=10;toast('速射!','#ffaa33');}
   else if(u.t==='H'){p.hp=Math.min(100,p.hp+30);toast('生命 +30','#ff4488');}else{p.shield=10;toast('护盾!','#44aaff');}
   score+=25;boom(u.x,u.y,PU[u.t].c,12);snd(600,.15,'sine',.05,700);pus.splice(i,1);
  }
 }
 hud();
}

// 绘制
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*6.283;i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate(rnd(-1,1)*shake*9,rnd(-1,1)*shake*9);
 ctx.fillStyle='#07020f';ctx.fillRect(-20,-20,W+40,H+40);
 ctx.strokeStyle='rgba(130,90,255,.1)';ctx.lineWidth=1;ctx.beginPath();
 for(let x=0;x<=W;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(let y=0;y<=H;y+=50){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
 ctx.shadowColor='#19e6ff';ctx.shadowBlur=14;ctx.strokeStyle='#19e6ff';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
 // 道具
 for(const u of pus){
  if(u.l<3&&Math.floor(tt*8)%2)continue;const c=PU[u.t].c,pl=1+Math.sin(tt*6)*.12;
  ctx.shadowColor=c;ctx.shadowBlur=16;ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(u.x,u.y,14*pl,0,6.283);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=c;ctx.font='700 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(PU[u.t].l||u.t,u.x,u.y+1);
 }
 // 粒子
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.L);ctx.fillStyle=q.c;ctx.shadowColor=q.c;ctx.shadowBlur=6;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}
 ctx.globalAlpha=1;
 // 敌人
 for(const e of enemies){
  const c=e.fl>0?'#ffffff':e.c;ctx.shadowColor=e.c;ctx.shadowBlur=14;ctx.fillStyle=c;
  const ang=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.t==='g'){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.283);ctx.fill();ctx.fillStyle='#1a0510';ctx.beginPath();ctx.arc(e.x+Math.cos(ang)*4,e.y+Math.sin(ang)*4,4,0,6.283);ctx.fill();}
  else if(e.t==='r'){poly(e.x,e.y,e.r+3,3,ang);ctx.fill();}
  else if(e.t==='t'){poly(e.x,e.y,e.r,6,tt*.5);ctx.fill();ctx.fillStyle='#1c0a33';poly(e.x,e.y,e.r*.55,6,-tt*.8);ctx.fill();}
  else{poly(e.x,e.y,e.r+2,4,ang+.785);ctx.fill();ctx.fillStyle='#052a30';ctx.beginPath();ctx.arc(e.x,e.y,4,0,6.283);ctx.fill();}
  if(e.mhp>1&&e.hp<e.mhp){ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle=e.c;ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*e.hp/e.mhp,4);}
 }
 // 子弹
 ctx.shadowBlur=10;
 for(const b of eb){ctx.fillStyle=ctx.shadowColor='#ff7733';ctx.beginPath();ctx.arc(b.x,b.y,4.5,0,6.283);ctx.fill();}
 for(const b of pb){ctx.strokeStyle=ctx.shadowColor=p.spread>0?'#44ff88':'#ffffff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.018,b.y-b.vy*.018);ctx.stroke();}
 // 玩家
 if(p.vis){
  ctx.globalAlpha=p.invuln>0&&Math.floor(tt*20)%2?.4:1;
  ctx.shadowColor='#19e6ff';ctx.shadowBlur=18;ctx.fillStyle='#19e6ff';
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
  ctx.fillRect(4,-4,20,8);ctx.beginPath();ctx.arc(0,0,p.r,0,6.283);ctx.fill();
  ctx.fillStyle='#04202a';ctx.beginPath();ctx.arc(0,0,p.r*.5,0,6.283);ctx.fill();ctx.restore();
  if(p.shield>0){ctx.strokeStyle='#44aaff';ctx.shadowColor='#44aaff';ctx.lineWidth=3;ctx.globalAlpha=p.shield<2&&Math.floor(tt*10)%2?.3:.9;ctx.beginPath();ctx.arc(p.x,p.y,p.r+8,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  if(p.dashCd>0){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r+14,-1.57,-1.57+6.283*(1-p.dashCd/1.6));ctx.stroke();}
 }
 // 准星与摇杆
 ctx.shadowBlur=0;
 if(state==='play'&&!sticks.r&&mx&&matchMedia('(pointer:fine)').matches){ctx.strokeStyle='#ff7ad9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx,my,10,0,6.283);ctx.moveTo(mx-16,my);ctx.lineTo(mx-6,my);ctx.moveTo(mx+6,my);ctx.lineTo(mx+16,my);ctx.moveTo(mx,my-16);ctx.lineTo(mx,my-6);ctx.moveTo(mx,my+6);ctx.lineTo(mx,my+16);ctx.stroke();}
 for(const s of[sticks.l,sticks.r])if(s){const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy)||1,k=Math.min(55,d)/d;
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.ox,s.oy,55,0,6.283);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(s.ox+dx*k,s.oy+dy*k,24,0,6.283);ctx.fill();}
 ctx.restore();
}

// 输入
addEventListener('keydown',e=>{
 keys[e.code]=1;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if((e.code==='Space'||e.code==='Enter')&&state!=='play'&&$('menu').style.display!=='none'){start();return;}
 if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')dashReq=true;
 if(e.code==='KeyP'||e.code==='Escape')setPause(!paused);
 if(e.code==='KeyM'){muted=!muted;toast(muted?'已静音':'声音开启');}
});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
cv.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY;if(e.button===2)dashReq=true;else mDown=true;});
addEventListener('mouseup',()=>mDown=false);
addEventListener('contextmenu',e=>e.preventDefault());
function tch(e,fn){e.preventDefault();for(const t of e.changedTouches)fn(t);}
cv.addEventListener('touchstart',e=>tch(e,t=>{
 const s={id:t.identifier,ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY};
 if(t.clientX<W/2&&!sticks.l)sticks.l=s;else if(t.clientX>=W/2&&!sticks.r)sticks.r=s;}),{passive:false});
cv.addEventListener('touchmove',e=>tch(e,t=>{for(const k of['l','r'])if(sticks[k]&&sticks[k].id===t.identifier){sticks[k].x=t.clientX;sticks[k].y=t.clientY;}}),{passive:false});
const tend=e=>tch(e,t=>{for(const k of['l','r'])if(sticks[k]&&sticks[k].id===t.identifier)sticks[k]=null;});
cv.addEventListener('touchend',tend,{passive:false});cv.addEventListener('touchcancel',tend,{passive:false});
$('db').addEventListener('pointerdown',e=>{dashReq=true;e.stopPropagation();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
$('pause').onclick=()=>setPause(false);$('go').onclick=start;

let last=performance.now();
(function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused)update(dt);
 draw();
})(last);
hud();
</script>
</body>
